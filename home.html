<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>City Bistro | Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">City Bistro</div>
    <ul class="nav-links">
      <li><a href="home.html" class="active">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="service.html">Services</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to City Bistro</h1>
    
    <button class="btn" id="bookBtn">Order Now..!!</button>
  </section>
  

  <!-- Booking Modal -->
  <div id="bookingModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2>Book a Table</h2>
      <form action="book_table.php" method="POST">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Email Address" required />
        <input type="tel" name="phone" placeholder="Phone Number" required />
        <label for="date">Date:</label>
        <input type="date" name="date" id="date" required />
        <label for="time">Time:</label>
        <input type="time" name="time" id="time" required />
        <input type="number" name="guests" placeholder="Number of Guests" min="1" required />
        <button type="submit">Confirm Booking</button>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
